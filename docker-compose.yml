services:
  db:
    image: postgres:15-alpine
    container_name: chorespec-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chorespec}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Use image from GitHub Container Registry

    image: ghcr.io/frankandreas/family-chore-backend:latest
    container_name: chorespec-backend
    volumes:
      - chores_data:/app/data
      - chores_uploads:/app/uploads
      - chores_backups:/app/backups
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chorespec}
      # Legacy SQLite fallback: - DATABASE_URL=sqlite:///./data/chorespec.db
      # --- Settings from .env (see .env.example and README_DOCKER.md) ---
      # Keys left empty are auto-generated inside the container and are lost
      # whenever it is recreated (e.g. on every update), so set them in .env.
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_CLAIMS_EMAIL=${VAPID_CLAIMS_EMAIL:-mailto:admin@example.com}
      # The login is the family hub's (FrankAndreas/family-hub): how this backend
      # reaches it (e.g. http://<NAS_IP>:8086), where browsers log in and out
      # (https://home.local.<domain>), and this app's key in the hub
      - HUB_URL=${HUB_URL:-}
      - HUB_PUBLIC_URL=${HUB_PUBLIC_URL:-}
      - HUB_APP_KEY=${HUB_APP_KEY:-chores}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000\")' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Use image from GitHub Container Registry

    image: ghcr.io/frankandreas/family-chore-frontend:latest
    container_name: chorespec-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  chores_data:
  chores_uploads:
  chores_backups:
