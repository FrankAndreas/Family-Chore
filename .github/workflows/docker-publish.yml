name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Lint with flake8
        run: |
          # Run flake8 on backend and tests directories
          # Enforce max line length of 120 chars
          flake8 backend tests --count --max-line-length=120 --statistics
      - name: Type check with mypy
        run: |
          mypy backend/
      - name: Run Tests
        run: |
          export PYTHONPATH=$PWD
          pytest tests/ -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint
        working-directory: ./frontend
        run: npm run lint
      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit
      - name: Test
        working-directory: ./frontend
        run: npm test
      - name: Build
        working-directory: ./frontend
        run: npm run build

  # Browser tests: Playwright starts the family hub the logins come from, the backend (fresh SQLite database) and the
  # frontend itself (e2e/), and runs axe on every page
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout the family hub
        uses: actions/checkout@v7
        with:
          repository: FrankAndreas/family-hub
          path: family-hub
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install backend dependencies (the app's, and the hub's in its own environment)
        run: |
          pip install -r backend/requirements.txt
          # The hub in an environment of its own: its pinned versions (e.g. SQLAlchemy) never clash with the
          # app's, so Dependabot can update either side alone
          python -m venv "$RUNNER_TEMP/hub-venv"
          "$RUNNER_TEMP/hub-venv/bin/pip" install -r family-hub/backend/requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      # Only the headless browser, without --with-deps: the runner image already has Chrome's system libraries
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install frontend and test dependencies
        run: |
          cd frontend && npm ci
          cd ../e2e && npm ci
          npx playwright install --only-shell chromium
      - name: Run browser tests
        run: cd e2e && E2E_PYTHON=python HUB_PYTHON="$RUNNER_TEMP/hub-venv/bin/python" HUB_DIR="$GITHUB_WORKSPACE/family-hub" npm test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  build-and-push:
    needs: [test-backend, test-frontend, test-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Name
        run: |
          echo "LOWERCASE_REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Extract metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.LOWERCASE_REPO }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Smoke Test
        run: |
          # docker-compose.yml has no default DB credentials; use throwaway ones for this run
          export POSTGRES_USER=ci_smoke
          export POSTGRES_PASSWORD="$(openssl rand -hex 16)"

          # 1. Start services using docker compose
          docker compose up -d --build
          
          # 2. Wait and Verify
          MAX_RETRIES=10
          COUNT=0
          SUCCESS=0
          
          echo "Waiting for services to be healthy..."
          until [ $COUNT -eq $MAX_RETRIES ]; do
            # Check if frontend is up
            if curl -s --fail http://localhost:8080/ > /dev/null; then
              echo "Frontend is UP"
              # Verify backend is reachable through frontend proxy
              if curl -s --fail http://localhost:8080/api/ > /dev/null; then
                echo "Backend API is reachable via Proxy"
                SUCCESS=1
                break
              fi
            fi
            echo "Waiting... (attempt $((COUNT+1))/$MAX_RETRIES)"
            docker compose logs --tail 10
            sleep 3
            COUNT=$((COUNT+1))
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "Smoke test FAILED."
            docker compose logs
            docker compose down
            exit 1
          fi
          
          echo "Smoke test PASSED."
          docker compose down

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Merge Dependabot patch and minor updates once all jobs above pass; majors stay manual
  dependabot-automerge:
    needs: [test-backend, test-frontend, test-e2e, build-and-push]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
