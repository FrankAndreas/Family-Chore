# Single-database-file variant: SQLite instead of Postgres (good for a home NAS).
# Copy it to the app folder on the NAS as compose.yaml; see README_DOCKER.md.
#
# The backend runs as APP_UID:APP_GID from .env (default 999:999, the image's own
# user). On a Synology, use a dedicated DSM user's IDs (see README_DOCKER.md).
# The ./data, ./uploads and ./backups folders must exist and belong to that user
# before the first start.

services:
  backend:
    image: ghcr.io/frankandreas/family-chore-backend:latest
    container_name: chorespec-backend
    user: "${APP_UID:-999}:${APP_GID:-999}"
    volumes:
      - ./data:/app/data          # SQLite database
      - ./uploads:/app/uploads    # task photos
      - ./backups:/app/backups    # the app's own nightly backups
    environment:
      - DATABASE_URL=sqlite:///./data/chorespec.db
      # Keys left empty are auto-generated inside the container and are lost
      # whenever it is recreated (e.g. on every update), so set them in .env.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_CLAIMS_EMAIL=${VAPID_CLAIMS_EMAIL:-mailto:admin@example.com}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}   # true only when served over HTTPS
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000\")' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/frankandreas/family-chore-frontend:latest
    container_name: chorespec-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
